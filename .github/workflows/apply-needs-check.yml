name: Apply needs-check UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/patch-needs-check.mjs
      - scripts/patch-needs-check-id.mjs
      - scripts/fix-needs-check-runtime.mjs
      - .github/workflows/apply-needs-check.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: |
          node scripts/patch-needs-check.mjs
          node scripts/patch-needs-check-id.mjs
          node scripts/fix-needs-check-runtime.mjs

      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: show needs-check as compact modal"
          git push
