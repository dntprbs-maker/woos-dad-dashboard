name: One-time needs-check UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if 'id="needsCheckPanel"' in s:
              print('already patched'); raise SystemExit(0)
          css='''
  .needs-check-panel{background:#fff8e8;border:1px solid #fde3a7;border-radius:18px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
  .needs-check-panel.hidden{display:none}.needs-check-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.needs-check-head strong{font-size:16px}.needs-check-count{background:#f59e0b;color:#fff;border-radius:999px;min-width:25px;height:25px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:800}.needs-check-item{background:#fff;border:1px solid #f5d48a;border-radius:13px;padding:11px 12px;margin-top:8px}.needs-check-title{font-size:14px;font-weight:800;line-height:1.4}.needs-check-meta{font-size:11px;color:#8a6a20;margin-top:4px}.needs-check-actions{display:flex;gap:7px;margin-top:9px}.needs-check-btn{border:0;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}.needs-check-open{background:#f3f5f8;color:#475569}.needs-check-done{background:#16a34a;color:#fff}
'''
          s=s.replace('\n</style>',css+'\n</style>',1)
          panel='''
    <section class="needs-check-panel hidden" id="needsCheckPanel" aria-live="polite">
      <div class="needs-check-head"><strong>🔔 확인필요</strong><span class="needs-check-count" id="needsCheckCount">0</span></div>
      <div id="needsCheckList"></div>
    </section>
'''
          anchor='''    <div class="section-title">\n      <h2>프로젝트</h2>'''
          assert anchor in s
          s=s.replace(anchor,panel+'\n'+anchor,1)
          old='''        id: page.id,\n        title: t.title || "(제목 없음)",'''
          if old in s: s=s.replace(old,'''        id: t.id || "",\n        title: t.title || "(제목 없음)",''',1)
          helper=r'''
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));}
function getNeedsCheckTasks(grouped){return Object.entries(grouped||{}).flatMap(([project,data])=>[...(data.todo||[]),...(data.done||[])].filter(x=>x.needsCheck).map(x=>({...x,project})));}
let liveNeedsCheckItems=[];
function renderNeedsCheck(grouped){const panel=document.getElementById("needsCheckPanel"),list=document.getElementById("needsCheckList"),count=document.getElementById("needsCheckCount");if(!panel||!list||!count)return;const items=getNeedsCheckTasks(grouped);liveNeedsCheckItems=items;count.textContent=items.length;panel.classList.toggle("hidden",items.length===0);list.innerHTML=items.map(item=>`<div class="needs-check-item" data-check-id="${escapeHtml(item.id)}"><div class="needs-check-title">${escapeHtml(item.title)}</div><div class="needs-check-meta">${escapeHtml(item.project)} · ${escapeHtml(item.status||"상태 없음")}</div><div class="needs-check-actions"><button class="needs-check-btn needs-check-open" type="button" onclick='openNeedsCheckTask(${JSON.stringify(item.id)})'>내용 보기</button><button class="needs-check-btn needs-check-done" type="button" onclick='confirmNeedsCheck(${JSON.stringify(item.id)})'>확인 완료</button></div></div>`).join("");}
function openNeedsCheckTask(id){const item=liveNeedsCheckItems.find(x=>x.id===id);if(item)openTask(item.title,item.project,item.status,item.priority,item.worker,item.desc,true);}
function notifyNewNeedsCheck(grouped){const items=getNeedsCheckTasks(grouped),ids=items.map(x=>x.id).filter(Boolean);let seen=[];try{seen=JSON.parse(localStorage.getItem("dadNeedsCheckSeen")||"[]")}catch(e){}const fresh=ids.filter(id=>!seen.includes(id));if(!fresh.length)return;localStorage.setItem("dadNeedsCheckSeen",JSON.stringify([...new Set([...seen,...fresh])].slice(-300)));const t=document.getElementById("toast");if(t){t.textContent=`🔔 새 확인필요 작업 ${fresh.length}건이 있습니다`;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3500)}if("Notification" in window&&Notification.permission==="granted"){try{new Notification("아빠 대시보드",{body:`새 확인필요 작업 ${fresh.length}건이 있습니다`})}catch(e){}}}
async function confirmNeedsCheck(id){const btn=document.querySelector(`[data-check-id="${CSS.escape(id)}"] .needs-check-done`);if(btn){btn.disabled=true;btn.textContent="처리 중…"}try{const res=await fetch("/api/check-task",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({id})});const payload=await res.json().catch(()=>({}));if(!res.ok||!payload.ok)throw new Error(payload.error||`API ${res.status}`);await loadLiveNotionData();const t=document.getElementById("toast");if(t){t.textContent="확인 완료 · 목록에서 제거했습니다";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}}catch(e){if(btn){btn.disabled=false;btn.textContent="확인 완료"}const t=document.getElementById("toast");if(t){t.textContent="확인 처리에 실패했습니다";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}console.error(e)}}
'''
          assert '\nasync function loadLiveNotionData(){' in s
          s=s.replace('\nasync function loadLiveNotionData(){',helper+'\nasync function loadLiveNotionData(){',1)
          marker='''    Object.assign(projectTasks, grouped);'''; assert marker in s
          s=s.replace(marker,marker+'''\n\n    renderNeedsCheck(grouped);\n    notifyNewNeedsCheck(grouped);''',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'id="needsCheckPanel"' index.html
          grep -q 'confirmNeedsCheck' index.html
          grep -q 'id: t.id' index.html
          test -f api/check-task.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: show and clear needs-check tasks"
          git push origin main
